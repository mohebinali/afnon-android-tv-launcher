name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch adhan audio
        run: bash tools/fetch-adhans.sh || echo "adhan fetch skipped; app builds without the clips"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" out/afnon-dammam.apk
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: afnon-dammam-apk
          path: out/afnon-dammam.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dammam-${{ github.run_number }}
          name: Afnon Dammam build ${{ github.run_number }}
          files: out/afnon-dammam.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
