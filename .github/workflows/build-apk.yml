name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # the release step needs this; it is not granted by default

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: the runner image already has the SDK at $ANDROID_HOME.
      - name: Show the SDK the runner gave us
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms dir)"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(no build-tools dir)"
          java -version

      - name: Make sure SDK 34 is present
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not at $SDKM — relying on the preinstalled SDK"
          fi

      - name: Fetch adhan audio (non-fatal)
        run: bash tools/fetch-adhans.sh || echo "adhan fetch skipped; the app builds without the clips"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "built: $APK"
          cp "$APK" out/afnon-dammam.apk
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: afnon-dammam-apk
          path: out/afnon-dammam.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dammam-${{ github.run_number }}
          name: Afnon Dammam build ${{ github.run_number }}
          files: out/afnon-dammam.apk
